<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        :root {
            --black: #0d0d0d;
            --dark: #151515;
            --pink: #ff2f92;
            --light-pink: #ff69b4;
            --text: #f5f5f5;
            --muted: #aaa;
        }

        body {
            background: var(--black);
            color: var(--text);
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 30px 0;
        }

        .container {
            max-width: 900px;
        }

        .card {
            background: var(--dark);
            border: 1px solid #292929;
            border-radius: 18px;
            overflow: hidden;
            transition: 0.3s ease;
        }

        .card:hover {
            border-color: var(--pink);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 47, 146, 0.15) !important;
        }

        .card-body {
            padding: 35px;
        }

        h3 {
            color: var(--pink);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Counter */

        #count {
            min-width: 70px;
            color: white;
            font-size: 42px !important;
            text-shadow: 0 0 15px rgba(255, 47, 146, 0.5);
        }

        #increase,
        #decrease {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: none;
            font-size: 30px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.25s ease;
        }

        #increase {
            background: var(--pink);
            color: white;
        }

        #decrease {
            background: transparent;
            color: var(--pink);
            border: 2px solid var(--pink);
        }

        #increase:hover {
            background: var(--light-pink);
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 47, 146, 0.5);
        }

        #decrease:hover {
            background: var(--pink);
            color: white;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 47, 146, 0.5);
        }

        #resetBtn {
            background: transparent;
            border: 1px solid #555;
            color: #ddd;
            border-radius: 8px;
            padding: 8px 25px;
            transition: 0.25s ease;
        }

        #resetBtn:hover {
            background: #222;
            border-color: var(--pink);
            color: var(--pink);
        }

        /* Character Counter */

        #message {
            background: #101010;
            border: 1px solid #333;
            color: white;
            border-radius: 12px;
            padding: 15px;
            resize: vertical;
            transition: 0.25s ease;
        }

        #message::placeholder {
            color: #777;
        }

        #message:focus {
            background: #111;
            color: white;
            border-color: var(--pink);
            box-shadow: 0 0 0 3px rgba(255, 47, 146, 0.12);
        }

        .text-muted {
            color: var(--muted) !important;
        }

        #charCount {
            color: var(--pink);
            font-size: 17px;
        }

        @media (max-width: 576px) {
            body {
                padding: 15px 0;
            }

            .card-body {
                padding: 25px 18px;
            }

            h3 {
                font-size: 21px;
            }

            #count {
                font-size: 34px !important;
            }

            #increase,
            #decrease {
                width: 48px;
                height: 48px;
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- challenge-battle -->
    <div class="container">
        <div class="card shadow-sm mb-4 mt-4">
            <div class="card-body text-center">

                <h3 class="mb-4">Challenge 1 — Counter</h3>

                <div class="d-flex justify-content-center align-items-center gap-4 mb-4">

                    <button id="decrease" class="btn btn-danger btn-lg">−</button>

                    <span id="count" class="fs-2 fw-bold">0</span>

                    <button id="increase" class="btn btn-success btn-lg">+</button>

                </div>

                <button id="resetBtn" class="btn btn-secondary">Reset</button>

            </div>
        </div>


        <div class="card shadow-sm mb-4">
            <div class="card-body">

                <h3 class="mb-4">
                    Challenge 2 — Character Counter
                </h3>

                <textarea id="message" class="form-control" rows="4" maxlength="100"
                    placeholder="Write something..."></textarea>

                <p class="mt-2 text-muted">
                    Characters:
                    <span id="charCount" class="fw-bold"> 0</span> / 100
                </p>

            </div>
        </div>
    </div>


    <script src="botcamp2-2-script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
